name: deploy

# Deploy the Lakebase instance with Terraform, then run the data-plane post-hook
# jobs (the Postgres GRANTs Terraform can't express) — the same split the DABs
# pipeline uses, just with `terraform apply` where DABs had its pre-hook + bundle.
#
# Auth: the sh-lakebase-cicd SP (OAuth M2M) — the SAME identity the DABs pipeline
# uses. It must OWN the project (it does, because it runs `terraform apply` here)
# so the post-hook notebooks can create OAuth roles as a superuser.
#
# Required GitHub secrets (Settings > Secrets and variables > Actions):
#   DATABRICKS_HOST           https://adb-<id>.<n>.azuredatabricks.net
#   DATABRICKS_CLIENT_ID      cicd SP application id
#   DATABRICKS_CLIENT_SECRET  cicd SP OAuth secret
#   TF_APP_SP_ID              app SP application id (sh-lakebase-app) for the Data API grant
#
# NOTE ON STATE: this template uses local state, which does not persist between
# runs. For real CI point Terraform at a remote backend (e.g. azurerm blob) so the
# pipeline reconciles the same instance each run instead of trying to re-create it.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.tf"
      - "src/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # OAuth M2M — the databricks provider AND the CLI both pick these up.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      # Terraform inputs (workspace host + app SP to grant into the Data API).
      TF_VAR_workspace_host: ${{ secrets.DATABRICKS_HOST }}
      TF_VAR_app_service_principal_id: ${{ secrets.TF_APP_SP_ID }}
      # azure-cli tenant pin is not used in CI (SP auth), so leave it empty.
      TF_VAR_azure_tenant_id: ""

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9"

      - name: Terraform apply
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - uses: databricks/setup-cli@main

      # ---- Post-hook: run the data-plane GRANT jobs with the TF outputs ----
      - name: Post-hook data-plane grants
        run: |
          set -euo pipefail
          OUT=$(terraform output -json)
          PROJECT=$(echo "$OUT"   | jq -r '.project_id.value')
          DB=$(echo "$OUT"        | jq -r '.postgres_database.value')
          DEV_GROUP=$(echo "$OUT" | jq -r '.developer_group.value')
          APP_SP=$(echo "$OUT"    | jq -r '.app_service_principal_id.value')
          DATA_JOB=$(echo "$OUT"  | jq -r '.setup_data_role_job_id.value')
          API_JOB=$(echo "$OUT"   | jq -r '.setup_dataapi_role_job_id.value')

          # NOTE: `jobs run-now --json` takes job_id INSIDE the JSON, not as a
          # positional arg (the CLI rejects a positional id alongside --json).

          # Developer group -> read-only SELECT on the database (direct-connection).
          if [ -n "$DEV_GROUP" ] && [ "$DEV_GROUP" != "null" ] && [ "$DATA_JOB" != "null" ]; then
            echo "Granting SELECT to group $DEV_GROUP on $PROJECT/$DB"
            databricks jobs run-now --json "$(jq -n \
              --argjson job "$DATA_JOB" --arg p "$PROJECT" --arg d "$DB" --arg i "$DEV_GROUP" \
              '{job_id:$job,job_parameters:{project_id:$p,database:$d,identity:$i,identity_type:"GROUP",privileges:"SELECT"}}')"
          fi

          # App SP -> Data API (GRANT sp TO authenticator + DML). data_api.tf already
          # enabled the API, so the authenticator role exists.
          if [ -n "$APP_SP" ] && [ "$APP_SP" != "null" ] && [ "$API_JOB" != "null" ]; then
            echo "Wiring SP $APP_SP into the Data API on $PROJECT/$DB"
            databricks jobs run-now --json "$(jq -n \
              --argjson job "$API_JOB" --arg p "$PROJECT" --arg d "$DB" --arg i "$APP_SP" \
              '{job_id:$job,job_parameters:{project_id:$p,database:$d,identity:$i}}')"
          fi
